name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/inspiring-hypatia-rpjq0j
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build English page
        run: python3 tools/build-en.py

      # 只上傳網站用得到的檔案：品牌素材資料夾與壓縮檔、原始照片、歸檔與工具不發布，部署包從 117 MB 降到約 10 MB，避免發布逾時
      - name: Stage site files
        run: |
          mkdir _site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' --exclude='./tools' \
            --exclude='./source' --exclude='./brand' --exclude='./docs' --exclude='./ASSET_MANIFEST.json' -cf - . | tar -xf - -C _site

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Artifact uploads can precede their visibility in the Actions listing API.
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visible_reads=0
          for attempt in $(seq 1 18); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" = "1" ]; then
              visible_reads=$((visible_reads + 1))
              if [ "$visible_reads" -ge 3 ]; then
                echo "Pages artifact is consistently readable."
                sleep 5
                exit 0
              fi
            else
              visible_reads=0
            fi
            if [ "$count" -gt 1 ]; then
              echo "Multiple Pages artifacts found; start a fresh workflow run."
              exit 1
            fi
            echo "Waiting for uploaded Pages artifact ($attempt/18)."
            sleep 5
          done
          echo "Pages artifact did not become readable."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
