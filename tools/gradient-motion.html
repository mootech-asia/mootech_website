<!doctype html><meta charset="utf-8"><style>body{margin:0;background:transparent}canvas{display:block}</style><canvas id="out" width="360" height="360"></canvas><script>
const names=['vision','team','ideas','learning','workspace','coffee','fitness'];
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl',{alpha:true,preserveDrawingBuffer:true,premultipliedAlpha:false,antialias:true});
const vs=`attribute vec2 p;varying vec2 uv;uniform float t;uniform float mode;
vec2 turn(vec2 v,vec2 c,float a){float s=sin(a),co=cos(a);v-=c;return c+vec2(co*v.x-s*v.y,s*v.x+co*v.y);}
float band(float v,float a,float b,float c,float d){return smoothstep(a,b,v)*(1.-smoothstep(c,d,v));}
void main(){uv=p;vec2 v=p;float w=sin(t*6.2831853),e=.5-.5*cos(t*6.2831853);
if(mode==0.){float hand=smoothstep(.57,.74,p.x)*band(p.y,.30,.39,.67,.74);v=mix(v,turn(v,vec2(.63,.53),w*.14),hand);}
if(mode==1.){
// Bodies lean in and release around a fixed palm-contact anchor.
 float side=p.x<.5?-1.:1.;v=turn(v,vec2(.5,.32),side*(1.-e)*.065);v.y+=.006*w*band(p.y,.55,.75,.98,1.);
}
if(mode==2.){
// Lecturer's pointing forearm sweeps toward the board, feet and board stay anchored.
 float arm=band(p.y,.31,.38,.55,.63)*band(p.x,.33,.45,.68,.73)*smoothstep(1.,1.15,length((p-vec2(.30,.28))/vec2(.23,.23)));v=mix(v,turn(v,vec2(.42,.54),w*.08),arm);
 float head=band(p.y,.08,.16,.40,.45)*(1.-smoothstep(.50,.60,p.x));v=mix(v,turn(v,vec2(.35,.42),w*.025),head);
}
if(mode==3.){
// Seated left profile: two keyboard-hand regions alternate their keystrokes.
 float hands=band(p.y,.50,.54,.60,.625)*band(p.x,.27,.34,.64,.70);v.y+=hands*.012*sin(t*25.1327+p.x*18.);
 float head=band(p.y,.08,.16,.42,.49)*band(p.x,.32,.42,.73,.82);v=mix(v,turn(v,vec2(.57,.46),w*.02),head);
}
if(mode==4.){
// Walking guide: alternating leg swing below the hips; doorway remains stationary.
 float leg=smoothstep(.63,.75,p.y)*(1.-smoothstep(.60,.70,p.x));float side=p.x<.39?-1.:1.;v=mix(v,turn(v,vec2(.39,.69),side*w*.10),leg);
 float torso=band(p.y,.30,.40,.64,.73)*(1.-smoothstep(.61,.72,p.x));v.x+=torso*.012*w;
}
if(mode==5.){
// Seated drinker: cup and holding forearm follow the same arc to the blank face.
 float cupArm=band(p.y,.44,.48,.62,.66)*band(p.x,.27,.32,.58,.63);v=mix(v,turn(v,vec2(.34,.62),-.14*e),cupArm);
}
if(mode==6.){
// Symmetrical dumbbell curls, with both weights inside their corresponding hand regions.
 float arms=band(p.y,.50,.54,.69,.74);float side=p.x<.5?-1.:1.;float outer=1.-band(p.x,.35,.43,.57,.65);float amount=arms*outer;
 v=mix(v,turn(v,vec2(side<0.?.32:.68,.60),-side*e*.28),amount);
}
gl_Position=vec4((v.x-.5)*2.,(.5-v.y)*2.,0.,1.);}`;
const fs=`precision mediump float;varying vec2 uv;uniform sampler2D image;void main(){gl_FragColor=texture2D(image,uv);}`;
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);gl.useProgram(program);
let points=[];for(let y=0;y<100;y++)for(let x=0;x<100;x++){let a=x/100,b=y/100,c=(x+1)/100,d=(y+1)/100;points.push(a,b,c,b,c,d,a,b,c,d,a,d);}
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(points),gl.STATIC_DRAW);let p=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);
const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
let current=-1;
window.draw=async(mode,frame)=>{if(current!==mode){const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=names[mode]+'.png';});gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);current=mode;}gl.uniform1f(gl.getUniformLocation(program,'mode'),mode);gl.uniform1f(gl.getUniformLocation(program,'t'),frame/40);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,points.length/2);};
</script>
